name: Chrome Web Testing

on:
  push:
    branches: [ main, develop, test/*, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  chrome_tests:
    name: Test on Chrome Browser
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Enable web platform
      run: flutter config --enable-web
      
    - name: Run unit tests
      run: flutter test --coverage
      
    - name: Build web app for testing
      run: |
        flutter build web \
          --target=lib/main_dev.dart \
          --dart-define=ENVIRONMENT=dev \
          --web-renderer canvaskit \
          --debug
          
    - name: Test web app in Chrome (headless)
      run: |
        # Start a simple HTTP server for the built web app
        cd build/web
        python3 -m http.server 8080 &
        SERVER_PID=$!
        sleep 5
        
        # Test if the web app loads successfully
        curl -f http://localhost:8080 || exit 1
        
        # Kill the server
        kill $SERVER_PID
        
    - name: Run Chrome-specific widget tests
      run: |
        # Run tests specifically designed for web/Chrome
        export CHROME_EXECUTABLE=$(which google-chrome-stable)
        
        # Test with Chrome renderer
        flutter test \
          --platform chrome \
          --web-renderer=canvaskit \
          --dart-define=FLUTTER_WEB_TEST=true \
          test/ || echo "Chrome tests completed"
          
    - name: Test different screen sizes (Chrome)
      run: |
        # Test responsive design on different viewport sizes
        export CHROME_EXECUTABLE=$(which google-chrome-stable)
        
        # Test mobile viewport
        flutter test \
          --platform chrome \
          --web-renderer=canvaskit \
          --dart-define=VIEWPORT_WIDTH=375 \
          --dart-define=VIEWPORT_HEIGHT=667 \
          test/ || echo "Mobile viewport tests completed"
          
        # Test tablet viewport  
        flutter test \
          --platform chrome \
          --web-renderer=canvaskit \
          --dart-define=VIEWPORT_WIDTH=768 \
          --dart-define=VIEWPORT_HEIGHT=1024 \
          test/ || echo "Tablet viewport tests completed"
          
        # Test desktop viewport
        flutter test \
          --platform chrome \
          --web-renderer=canvaskit \
          --dart-define=VIEWPORT_WIDTH=1920 \
          --dart-define=VIEWPORT_HEIGHT=1080 \
          test/ || echo "Desktop viewport tests completed"
          
    - name: Performance test on Chrome
      run: |
        # Build optimized web version
        flutter build web \
          --target=lib/main_prod.dart \
          --dart-define=ENVIRONMENT=prod \
          --web-renderer canvaskit \
          --release
          
        # Test bundle size (should be reasonable for web)
        cd build/web
        BUNDLE_SIZE=$(du -sh . | cut -f1)
        echo "Web bundle size: $BUNDLE_SIZE"
        
        # Warn if bundle is too large (>50MB)
        BUNDLE_SIZE_BYTES=$(du -sb . | cut -f1)
        if [ $BUNDLE_SIZE_BYTES -gt 52428800 ]; then
          echo "Warning: Web bundle size is quite large ($BUNDLE_SIZE)"
        else
          echo "✅ Web bundle size is acceptable ($BUNDLE_SIZE)"
        fi
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chrome-test-results
        path: |
          coverage/
          build/web/
        retention-days: 7