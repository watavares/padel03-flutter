name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  # Quick checks for PR
  pr_checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze code
      run: dart analyze --fatal-warnings
      
    - name: Run tests with coverage
      run: flutter test --coverage
      
    - name: Check test coverage
      run: |
        COVERAGE=$(grep -o 'lines......: [0-9.]*%' coverage/lcov.info | grep -o '[0-9.]*' | head -1)
        echo "Test coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "❌ Test coverage is below 80%"
          exit 1
        else
          echo "✅ Test coverage is above 80%"
        fi
      continue-on-error: true
      
    - name: Comment PR with results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const fs = require('fs');
          
          // Check if coverage file exists
          let coverageInfo = "Coverage information not available";
          if (fs.existsSync('coverage/lcov.info')) {
            try {
              const coverage = fs.readFileSync('coverage/lcov.info', 'utf8');
              const match = coverage.match(/lines......: ([0-9.]+)%/);
              if (match) {
                coverageInfo = `Test Coverage: ${match[1]}%`;
              }
            } catch (e) {
              coverageInfo = "Error reading coverage file";
            }
          }
          
          const comment = `## 🔍 PR Quality Check Results
          
          **Formatting:** ${process.env.FORMAT_STATUS || '✅ Passed'}
          **Analysis:** ${process.env.ANALYZE_STATUS || '✅ Passed'}  
          **Tests:** ${process.env.TEST_STATUS || '✅ Passed'}
          **Coverage:** ${coverageInfo}
          
          ---
          *Automated check completed at ${new Date().toISOString()}*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Build validation for different environments
  build_validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: pr_checks
    
    strategy:
      matrix:
        target: [dev, staging]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Web (${{ matrix.target }})
      run: |
        flutter build web \
          --target=lib/main_${{ matrix.target }}.dart \
          --dart-define=ENVIRONMENT=${{ matrix.target }} \
          --web-renderer canvaskit
          
    - name: Validate build output
      run: |
        if [ ! -f "build/web/index.html" ]; then
          echo "❌ Build failed - index.html not found"
          exit 1
        fi
        
        if [ ! -d "build/web/assets" ]; then
          echo "❌ Build failed - assets directory not found"
          exit 1
        fi
        
        echo "✅ Build validation passed for ${{ matrix.target }}"