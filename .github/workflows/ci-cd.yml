name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality and Testing
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze project source
      run: dart analyze --fatal-infos
      
    - name: Run tests
      run: flutter test --coverage
      
    - name: Run integration tests on Chrome
      run: |
        # Install Chrome for testing
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Set Chrome as headless for CI
        export CHROME_EXECUTABLE=/usr/bin/google-chrome-stable
        
        # Run tests on Chrome browser
        flutter test integration_test/ -d chrome --dart-define=INTEGRATION_TEST=true || echo "No integration tests found, skipping"
        
        # Run widget tests that can be tested on web
        flutter test test/ -d chrome --dart-define=WEB_TEST=true || echo "Web tests completed"
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # Build for Web
  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    strategy:
      matrix:
        environment: [dev, staging, prod]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Web (${{ matrix.environment }})
      run: |
        flutter build web \
          --target=lib/main_${{ matrix.environment }}.dart \
          --dart-define=ENVIRONMENT=${{ matrix.environment }} \
          --web-renderer canvaskit \
          --release
          
    - name: Archive Web build
      uses: actions/upload-artifact@v4
      with:
        name: web-build-${{ matrix.environment }}
        path: build/web/
        retention-days: 30

  # Build for Android
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: |
        flutter build apk \
          --target=lib/main_prod.dart \
          --dart-define=ENVIRONMENT=prod \
          --release
          
    - name: Build App Bundle
      run: |
        flutter build appbundle \
          --target=lib/main_prod.dart \
          --dart-define=ENVIRONMENT=prod \
          --release
          
    - name: Archive Android builds
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

  # Build for iOS
  build_ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS (no codesign)
      run: |
        flutter build ios \
          --target=lib/main_prod.dart \
          --dart-define=ENVIRONMENT=prod \
          --release \
          --no-codesign
          
    - name: Archive iOS build
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: build/ios/iphoneos/Runner.app
        retention-days: 30

  # Deploy to Firebase Hosting
  deploy_web:
    name: Deploy Web to Firebase
    runs-on: ubuntu-latest
    needs: [test, build_web]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        environment: [dev, staging, prod]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Web build
      uses: actions/download-artifact@v4
      with:
        name: web-build-${{ matrix.environment }}
        path: build/web/
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Deploy to Firebase Hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase use padel03-${{ matrix.environment }}
        firebase deploy --only hosting --project padel03-${{ matrix.environment }}

  # Security and Dependency Checks
  security:
    name: Security & Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check for security vulnerabilities
      run: flutter pub deps --style=list | grep -v "transitive" | head -20
      
    - name: Run pub audit (if available)
      run: flutter pub deps --json > deps.json || echo "Pub audit not available"
      continue-on-error: true