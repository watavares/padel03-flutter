name: 🚀 Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build-and-deploy:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # ✅ Checkout repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ✅ Setup Flutter
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ✅ Get Flutter dependencies
      - name: 📦 Get Dependencies
        run: flutter pub get

      # ✅ Run tests
      - name: 🧪 Run Tests
        run: flutter test

      # ✅ Build for production
      - name: 🔨 Build Web App
        run: |
          flutter build web \
            --dart-define=FLAVOR=production \
            --release \
            --source-maps

      # ✅ Deploy to Firebase Hosting (Production)
      - name: 🚀 Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADEL03_PROD }}'
          projectId: 'padel03-prod'
          channelId: live
          target: hosting-prod
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # ✅ Create preview channel for PRs
      - name: 🔍 Deploy Preview Channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADEL03_PROD }}'
          projectId: 'padel03-prod'
          target: hosting-prod
          expires: 7d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # ✅ Comment preview URL on PR
      - name: 💬 Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 Preview URL')
            );
            
            const body = `## 🔍 Preview URL
            
            Your changes have been deployed to a preview channel:
            
            🌐 **Preview URL**: [Click here to view](${{ steps.deploy-preview.outputs.details_url }})
            
            ⏰ **Expires**: 7 days from now
            
            ---
            
            > This comment is automatically updated when you push new commits.`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # 🔄 Deploy to staging on staging branch
  deploy-staging:
    name: 🎭 Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Web App (Staging)
        run: |
          flutter build web \
            --dart-define=FLAVOR=staging \
            --output=build/web-stg

      - name: 🎭 Deploy to Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADEL03_STG }}'
          projectId: 'padel03-staging'
          channelId: live
          target: hosting-stg
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  # 🧪 Deploy to development on develop branch
  deploy-development:
    name: 🧪 Deploy to Development
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Web App (Development)
        run: |
          flutter build web \
            --dart-define=FLAVOR=dev \
            --output=build/web-dev

      - name: 🧪 Deploy to Development
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADEL03_DEV }}'
          projectId: 'padel03-dev'
          channelId: live
          target: hosting-dev
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks